worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    types {
        text/html html;
        text/javascript js;
        application/json json;
        application/wasm wasm;
        font/ttf ttf;
        text/plain wgsl wesl md txt;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip_static on;
    gzip_vary on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $flock_cache {
        default "no-cache";
        "~^/releases/[0-9a-f]{24}/" "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /srv/flock;
        index index.html;
        add_header Cache-Control $flock_cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { try_files $uri $uri/ =404; }
    }
}
