<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d25">
  <link rel="icon" href="data:,">
  <meta name="description" content="A small world in motion. Watch bird clouds, drifting fish and ocean hunts in an interactive nature showcase.">
  <base href="__RELEASE_BASE__">
  <title>Flock — A small world in motion</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.6 system-ui, sans-serif; color: #f0f4e9; background: #071d25; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; opacity: 0; touch-action: none; outline-offset: -4px; }
    canvas:focus-visible { outline: 2px solid #a5d4b3; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; padding: clamp(1.5rem, 6vw, 4rem); background: radial-gradient(ellipse at 65% 5%, #315a4d 0, transparent 62%), radial-gradient(ellipse at 15% 95%, #173c43 0, transparent 58%), #071d25; z-index: 10; isolation: isolate; }
    #loading::before { content: ''; position: absolute; width: min(54vw, 36rem); aspect-ratio: 1; border-radius: 50%; top: -30%; right: 2%; background: #d4dcb6; opacity: .035; box-shadow: 0 0 12rem 5rem #d4dcb622; z-index: -1; }
    .landscape { position: absolute; inset: auto 0 0; width: 100%; height: 85%; opacity: .28; z-index: -1; pointer-events: none; }
    .card { width: min(36rem, 100%); text-align: center; padding-bottom: 2rem; }
    .brand-mark { width: 7rem; height: 2.5rem; color: #cbdba9; margin-bottom: .7rem; }
    .eyebrow { font-size: .66rem; letter-spacing: .25em; color: #b3cbbb; text-transform: uppercase; }
    h1 { font-size: clamp(4.5rem, 16vw, 8.5rem); line-height: 1; font-weight: 350; letter-spacing: .055em; margin: 1rem 0; padding-left: .055em; }
    .tagline { color: #c3d4ca; font-size: clamp(1rem, 3vw, 1.2rem); margin: 1rem 0 clamp(2rem, 7vh, 4rem); }
    .progress-block { width: min(27rem, 100%); margin: 0 auto; }
    #message { color: #edf3e6; min-height: 1.6em; margin: 0 0 1rem; text-wrap: balance; }
    progress { display: block; appearance: none; border: 0; border-radius: 1rem; overflow: hidden; width: 100%; height: .3rem; background: #43605a; accent-color: #cbdba9; }
    progress::-webkit-progress-bar { background: #43605a; border-radius: 1rem; }
    progress::-webkit-progress-value { background: #cbdba9; border-radius: 1rem; }
    progress::-moz-progress-bar { background: #cbdba9; border-radius: 1rem; }
    progress:indeterminate { opacity: .65; }
    #detail { color: #b2c9c1; min-height: 2.6em; font-size: .78rem; margin: .85rem 0 1rem; font-variant-numeric: tabular-nums; }
    button { border: 1px solid #a1bda5; color: #f1f7e9; background: #1b463d; padding: .65rem 1.3rem; border-radius: 2rem; font: inherit; cursor: pointer; }
    button:hover { background: #285548; }
    button:focus-visible { outline: 2px solid #dcdf99; outline-offset: 4px; }
    .worlds { position: absolute; bottom: max(1.25rem, env(safe-area-inset-bottom)); margin: 0; color: #9ebbb0; font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; }
    @media (max-height: 540px) { .brand-mark, .eyebrow, .worlds { display: none; } .card { padding: 0; } h1 { font-size: 4rem; margin: 0; } .tagline { margin: .5rem 0 1.25rem; } }
    noscript { position: fixed; inset: 0; padding: 4rem; z-index: 20; background: #071d25; }
  </style>
</head>
<body>
  <main aria-label="Interactive nature showcase" aria-busy="true" inert>
    <canvas id="flock" tabindex="0" aria-label="Flock nature scene. Use the on-screen help for camera and keyboard controls."></canvas>
  </main>
  <div id="loading">
    <svg class="landscape" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" fill="none" aria-hidden="true">
      <g stroke="#8eb7a5" stroke-width="1">
        <path d="M-100 810 Q250 610 620 770 T1700 720 M-100 840 Q300 660 700 800 T1700 750 M-100 880 Q330 700 780 840 T1700 790"/>
        <path d="M-100 920 Q400 750 850 885 T1700 830"/>
      </g>
      <g stroke="#cbdba9" stroke-width="2" stroke-linecap="round" opacity=".6">
        <path d="M1130 205q13-10 25 3q10-14 24-8 M1200 180q10-8 19 2q8-11 19-6 M1244 220q8-6 15 1q6-8 14-4 M1090 247q8-6 15 1q6-8 14-4 M1305 170q6-5 12 1q5-7 11-3"/>
      </g>
    </svg>
    <section class="card" aria-labelledby="loader-title">
      <svg class="brand-mark" viewBox="0 0 120 40" fill="none" aria-hidden="true"><path d="M8 18Q35 4 60 29Q85 4 112 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="eyebrow">NATURE, IN MOTION</div>
      <h1 id="loader-title">FLOCK</h1>
      <p class="tagline">A small world in motion.</p>
      <div class="progress-block">
        <p id="message" role="status" aria-live="polite" aria-atomic="true">Finding a window into the wild…</p>
        <progress id="download-progress" aria-label="Preparing the scene" aria-describedby="detail"></progress>
        <p id="detail">Preparing the scene on your device.</p>
        <button id="retry" type="button" hidden>Try again</button>
      </div>
    </section>
    <p class="worlds" aria-hidden="true">Evening skies &nbsp; · &nbsp; Quiet reefs &nbsp; · &nbsp; Open water</p>
  </div>
  <noscript>Flock needs JavaScript and desktop WebGPU to bring its animals to life. Enable JavaScript, then reload.</noscript>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
