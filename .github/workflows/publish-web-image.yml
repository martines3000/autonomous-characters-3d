name: Publish web image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '4'
      IMAGE: ghcr.io/martines3000/autonomous-characters-3d-web
    steps:
      - name: Require reviewed default-branch source
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v6
      - name: Install native baker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Install pinned Rust and browser tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          ./scripts/setup-web-tools.sh
          echo "$PWD/target/web-tools/bin" >> "$GITHUB_PATH"
      - name: Build static release
        run: ./scripts/build-web.sh
      - name: Verify source provenance
        run: |
          python3 - <<'PY'
          import json, os
          with open('dist/release.json') as source:
              release = json.load(source)
          assert release['revision'] == os.environ['GITHUB_SHA']
          assert release['dirty'] is False
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable source tag
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image provenance for the cluster PR
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Source: `%s`\n\nImage: `%s@%s`\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
