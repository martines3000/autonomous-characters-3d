name: Publish web image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'martines3000/autonomous-characters-3d' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install native baker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Install pinned Rust and browser tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          ./scripts/setup-web-tools.sh
          echo "$PWD/target/web-tools/bin" >> "$GITHUB_PATH"
      - name: Build static release
        run: ./scripts/build-web.sh
      - name: Verify source provenance
        run: |
          python3 - <<'PY'
          import json, os
          with open('dist/release.json') as source:
              release = json.load(source)
          assert release['revision'] == os.environ['GITHUB_SHA']
          assert release['dirty'] is False
          PY
      - name: Pass static files to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'martines3000/autonomous-characters-3d' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/martines3000/autonomous-characters-3d-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            Dockerfile
            .dockerignore
            web/nginx.conf
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: dist/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable source tag
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image provenance
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Source: %s\n\nImage: %s@%s\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
